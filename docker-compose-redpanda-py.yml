# Swaps the Go producer/consumer images for the Python ones.
# Usage: docker compose -f docker-compose-redpanda.yml -f docker-compose-redpanda-py.yml up --build
services:
  redpanda-producer:
    build:
      context: ./py-producer
    # Distinct tag so a later Go run never reuses the Python image.
    image: benchmark-py-redpanda-producer:local
  redpanda-consumer:
    build:
      context: ./py-consumer
    # Distinct tag so a later Go run never reuses the Python image.
    image: benchmark-py-redpanda-consumer:local
