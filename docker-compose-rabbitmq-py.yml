# Swaps the Go producer/consumer images for the Python ones.
# Usage: docker compose -f docker-compose-rabbitmq.yml -f docker-compose-rabbitmq-py.yml up --build
services:
  rabbitmq-producer:
    build:
      context: ./py-producer
    # Distinct tag so a later Go run never reuses the Python image.
    image: benchmark-py-rabbitmq-producer:local
  rabbitmq-consumer:
    build:
      context: ./py-consumer
    # Distinct tag so a later Go run never reuses the Python image.
    image: benchmark-py-rabbitmq-consumer:local
